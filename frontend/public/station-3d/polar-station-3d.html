<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maitri Research Station — Final Interactive 3D Digital Twin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(10,18,34,.8);--line:rgba(255,255,255,.13);--tx:#eaf2ff;--mut:#9fb0c8;--ok:#3ddc84;--bad:#ff5a4d;--amb:#ffc247;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0b1224;overflow:hidden;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx)}
#c{position:fixed;inset:0;cursor:grab;touch-action:none}#c:active{cursor:grabbing}
#hud{display:none;position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;max-width:calc(100vw - 28px);overflow-x:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
#hud div{display:flex;align-items:center;gap:10px;padding:10px 18px;border-right:1px solid var(--line);white-space:nowrap}
#hud div:last-child{border:0}
#hud i{font-style:normal;font-size:24px}#hud b{display:block;font-size:17px}#hud span{font-size:11px;color:var(--mut)}
#labels{display:none;position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{font-size:var(--fs,15px);position:absolute;left:0;top:0;display:flex;gap:.7em;align-items:center;padding:.6em .9em;background:var(--glass);border:1px solid var(--line);border-radius:.8em;backdrop-filter:blur(8px);white-space:nowrap;will-change:transform}
.lb .ph{width:5.4em;height:4.3em;border-radius:.45em;object-fit:cover;border:1px solid rgba(255,255,255,.35)}#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.ic{width:2.1em;height:2.1em;display:grid;place-items:center;border-radius:.55em;border:1.5px solid var(--c);color:var(--c);font-size:1.1em;background:rgba(255,255,255,.04)}
.t{font-size:.8em;font-weight:600;color:var(--mut)}.v{font-size:1.3em;font-weight:700;line-height:1.15}.s{font-size:.78em;font-weight:600;line-height:1.35}
.ok{color:var(--ok)}.bad{color:var(--bad)}.amb{color:var(--amb)}.mu{color:var(--mut)}
#bar{display:none;position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px 16px;background:var(--glass);border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;backdrop-filter:blur(8px)}
#bar em{font-style:normal;color:var(--ok)}
#tabs{position:fixed;right:14px;bottom:calc(62px + env(safe-area-inset-bottom,0px));display:flex;padding:4px;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#tabs button{font:inherit;font-size:13px;font-weight:700;color:var(--mut);background:none;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:7px}
#tabs button[aria-selected="true"]{background:rgba(61,220,132,.16);color:var(--ok)}
#tabs button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
#tabs .spin{display:inline-block;transition:transform .3s}
#tabs button[aria-selected="true"] .spin{animation:sp 2.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#tabs button[aria-selected="true"] .spin{animation:none}}
@media(max-width:700px){#hud div{padding:8px 12px}#hud i{font-size:18px}#hud b{font-size:14px}}

/* DHRUVA asset recognition labels — embedded Command Center mode */
#asset-labels{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.asset-label{position:absolute;transform:translate(-50%,-100%);padding:4px 8px 5px;max-width:190px;border:1px solid rgba(91,220,255,.55);border-radius:7px;background:rgba(4,13,24,.88);box-shadow:0 5px 18px rgba(0,0,0,.28);backdrop-filter:blur(6px);white-space:nowrap;font:700 10px/1.08 Manrope,system-ui,sans-serif;color:#eaf7ff;letter-spacing:.02em;text-shadow:0 1px 5px #000}
.asset-label:after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:rgba(91,220,255,.6)}
.asset-label .asset-type{display:block;font-size:7px;line-height:1.15;color:#7fdcff;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.asset-label .asset-value{display:block;font-size:9px;color:#b8c9d8;font-weight:600}
.asset-label.energy{border-color:rgba(61,220,132,.6)}.asset-label.energy .asset-type{color:#61e59b}
.asset-label.fuel{border-color:rgba(255,194,71,.65)}.asset-label.fuel .asset-type{color:#ffc247}
.asset-label.load{border-color:rgba(91,180,255,.6)}
.asset-label.small{padding:4px 7px;font-size:9px}.asset-label.small .asset-type{font-size:7px}

#station-mark{position:fixed;left:18px;bottom:18px;z-index:4;pointer-events:none;letter-spacing:.16em;text-transform:uppercase;font-size:10px;font-weight:700;color:rgba(235,244,255,.62);text-shadow:0 1px 8px #000}
#station-mark strong{display:block;font-size:15px;letter-spacing:.08em;color:rgba(245,249,255,.9)}
#tabs{z-index:5}

/* Embedded DHRUVA mode: the host owns all operational cards and labels. */
#hud,#labels,#lines,#tabs,#bar,#station-mark{display:none!important}
#asset-labels{display:block!important}
#c{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
</style>
<style>body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(4,10,20,.28) 100%);mix-blend-mode:multiply}</style>

<style id="startup-clean-view-css">
  /* Startup entry view: show the actual 3D station without embedded asset callout labels. */
  html.startup-mode #asset-labels, body.startup-mode #asset-labels { display:none !important; }
</style>
<script>
  /* URL-scoped startup mode keeps labels available in the Command Center, but removes them from the launch experience. */
  if (new URLSearchParams(window.location.search).get('startup') === '1') {
    document.documentElement.classList.add('startup-mode');
  }
</script>

<style id="digital-twin-maximize-css">
  html.dt-maximized, body.dt-maximized {
    width:100vw !important;
    height:100vh !important;
    margin:0 !important;
    overflow:hidden !important;

    inset:0 !important;

    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;

    display:block !important;
    position:fixed !important;
    inset:0 !important;

  }

<script>
/* DIGITAL TWIN ROTATION MODE */
(function(){
  window.POLAR_DIGITAL_TWIN_AUTO_ROTATE = true;
  window.POLAR_DIGITAL_TWIN_REDUCED_MOTION = false;
  window.addEventListener('message', function(ev){
    if(ev && ev.data && ev.data.type === 'POLAR_DIGITAL_TWIN_STARTUP_LABELS'){
      const host=document.getElementById('asset-labels');
      if(host) host.style.display = ev.data.show ? 'block' : 'none';
    }
    if(ev && ev.data && ev.data.type === 'POLAR_DIGITAL_TWIN_ROTATION_MODE'){
      window.POLAR_DIGITAL_TWIN_AUTO_ROTATE = !!ev.data.autoRotate;
      if(window.controls && 'autoRotate' in window.controls){
        window.controls.autoRotate = window.POLAR_DIGITAL_TWIN_AUTO_ROTATE;
      }
    }
  });
})();
</script>

  const fc=document.createElement('canvas');fc.width=300;fc.height=200;const fg=fc.getContext('2d');

  // busbars + insulators
  [-1,0,1].forEach(row=>{

  // security fence

  // ---------- ROADS / SNOW COMPACTION ----------

/* ================= FINAL DIGITAL TWIN MOTION V8 =================
   Subtle operational animation:
   - turbine rotation
   - PV sun tracking
   - BESS HVAC fans + status pulse
   - diesel radiator fans + exhaust pulse
   - moving service vehicles
   - animated energy/current flow
   - beacon/safety-light movement
   - gentle atmospheric motion
*/
(function(){
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const motion = {
    solar:null, battery:null, generator:null,
    fans:[], lights:[], vehicles:[]
  };

  // Locate the V6 equipment groups by their distinctive world-space geometry.
  const all = [];
  S.traverse(o=>all.push(o));

  // Solar array is the most recent group with a large number of blue PV cells.
  const solarCandidates = all.filter(o =>
    o.isGroup && o.children && o.children.length > 20
  );
  if (solarCandidates.length) {
    // Choose the group whose position is around the PV field.
    motion.solar = solarCandidates.find(o =>
      Math.abs(o.position.x + 27) < 2 && Math.abs(o.position.z + 16) < 2
    ) || null;
  }

  // Find large battery and generator assemblies by their world-space bounding boxes.
  // We also identify fan meshes by cylinder geometry and their local heights.
  const fanCandidates = [];
  S.traverse(o=>{
    if(!o.isMesh || !o.geometry) return;
    if(o.geometry.type === 'CylinderGeometry') fanCandidates.push(o);
  });

  // Battery HVAC fans are near the visible BESS yard after its corrected translation.
  fanCandidates.forEach(o=>{
    const p=o.getWorldPosition(new THREE.Vector3());
    if(p.x>15 && p.x<45 && p.z>-30 && p.z<0 && p.y>3.7 && p.y<5.0){
      motion.fans.push({o,axis:'y',speed:1.7});
    }
    // Generator radiator fans occupy the generator service zone.
    if(p.x>-20 && p.x<20 && p.z>20 && p.z<32 && p.y>2.6 && p.y<3.7){
      motion.fans.push({o,axis:'y',speed:2.4});
    }
  });

  // A few safe, restrained status lights on the station.
  const statusMat = new THREE.MeshStandardMaterial({
    color:0x48e0a0, emissive:0x116b49, emissiveIntensity:.65
  });
  const amberMat = new THREE.MeshStandardMaterial({
    color:0xffb84d, emissive:0x6b3208, emissiveIntensity:.7
  });

  [[-10,8.7,4.7],[0,8.7,4.7],[10,8.7,4.7]].forEach(p=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),statusMat.clone());
    m.position.set(...p); S.add(m); motion.lights.push({m,phase:Math.random()*6.28,rate:1.1});
  });
  [[-8,8.1,22.2],[0,8.1,22.2],[8,8.1,22.2]].forEach(p=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.08,10,8),amberMat.clone());
    m.position.set(...p); S.add(m); motion.lights.push({m,phase:Math.random()*6.28,rate:1.5});
  });

  // Two compact tracked utility vehicles that circulate slowly on the service loop.
  function vehicle(){
    const g=new THREE.Group();
    const body=new THREE.Mesh(
      new THREE.BoxGeometry(1.7,.62,2.8),
      new THREE.MeshStandardMaterial({color:0x59656d,metalness:.28,roughness:.7})
    );
    body.position.y=.62; g.add(body);
    const cab=new THREE.Mesh(
      new THREE.BoxGeometry(1.35,.72,1.25),
      new THREE.MeshStandardMaterial({color:0x344752,metalness:.2,roughness:.55})
    );
    cab.position.set(0,1.17,.35); g.add(cab);
    const glass=new THREE.Mesh(
      new THREE.BoxGeometry(1.05,.42,.035),
      new THREE.MeshStandardMaterial({color:0x244456,metalness:.35,roughness:.2})
    );
    glass.position.set(0,1.25,.99); g.add(glass);
    for(const x of [-.92,.92]){
      for(const z of [-.8,.8]){
        const w=new THREE.Mesh(
          new THREE.CylinderGeometry(.25,.25,.18,16),
          new THREE.MeshStandardMaterial({color:0x111417,roughness:.9})
        );
        w.rotation.z=Math.PI/2; w.position.set(x,.48,z); g.add(w);
      }
    }
    const lamp=new THREE.Mesh(
      new THREE.SphereGeometry(.055,8,8),
      new THREE.MeshStandardMaterial({color:0xffe2a0,emissive:0x6a450d,emissiveIntensity:.8})
    );
    lamp.position.set(0,.93,1.42); g.add(lamp);
    return g;
  }

  const v1=vehicle(), v2=vehicle();
  v1.position.set(-4,.55,43); v2.position.set(18,.55,43);
  S.add(v1,v2);
  motion.vehicles=[
    {g:v1,phase:0,speed:.022},
    {g:v2,phase:Math.PI,speed:.017}
  ];

  // Additional energy-flow pulses are already present in the original scene.
  // This adds a subtle physical "load heartbeat" to the station lighting.
  const clock=new THREE.Clock();
  function frame(){
    requestAnimationFrame(frame);
    if(reduced) return;
    const t=clock.getElapsedTime();

    // PV array gently tracks the sun instead of remaining perfectly static.
    if(motion.solar){
      motion.solar.rotation.y=-.12 + Math.sin(t*.055)*.035;
      motion.solar.rotation.x=-.48 + Math.sin(t*.035)*.012;
    }

    motion.fans.forEach(({o,axis,speed})=>{
      o.rotation[axis] += speed*.035*(window.POLAR_EMS_FLOW_INTENSITY||1);
    });

    motion.lights.forEach(({m,phase,rate})=>{
      m.material.emissiveIntensity=.45 + .5*(.5+.5*Math.sin(t*rate+phase));
    });

    // Slow service-vehicle route: oval/rectangular service loop.
    motion.vehicles.forEach((v,i)=>{
      const a=t*v.speed+v.phase;
      const x=5 + Math.cos(a)*34;
      const z=20 + Math.sin(a)*22;
      v.g.position.set(x,.56,z);
      v.g.rotation.y=-Math.atan2(Math.cos(a)*34,-Math.sin(a)*22);
    });
  }
  frame();

  window.POLAR_STATION_FINAL_MOTION = {
    version:'V8',
    batteryVisible:true,
    solarTracking:true,
    generatorFans:true,
    batteryCoolingFans:true,
    serviceVehicles:true,
    reducedMotionRespected:true
  };
})();


/* ================= DHRUVA ASSET RECOGNITION LABELS =================
   Embedded Command Center mode: concise default labels, collision-aware layout,
   grouped generation assets, and no label stack over the physical station.
*/
(function(){
  const host=document.getElementById('asset-labels');
  if(!host) return;
  if(new URLSearchParams(window.location.search).get('startup') === '1') { host.style.display='none'; return; }

  const labels=[
    {id:'main',name:'MAIN BUILDING',type:'STATION LOAD',pos:[-4,11.2,9.7],kind:'load',priority:1,value:()=>`LOAD · ${Math.round(Number(window.POLAR_EMS_LIVE_STATE?.power?.loadKw)||0)} kW`},
    {id:'research',name:'RESEARCH BLOCK',type:'LABS / OPERATIONS',pos:[24,4.8,-4.2],kind:'load',priority:3,value:()=>`IMPORTANT LOAD`},
    {id:'summer',name:'SUMMER CAMP',type:'CONTAINER MODULES',pos:[39,4.8,1],kind:'load',priority:4,value:()=>`SUPPORT FACILITY`},
    {id:'workshop',name:'WORKSHOP & UTILITIES',type:'SERVICE FACILITY',pos:[16,5.2,26],kind:'load',priority:5,value:()=>`SERVICE LOAD`},
    {id:'pump',name:'WATER PUMP HOUSE',type:'UTILITY / WATER',pos:[-24,4.5,25],kind:'load',priority:6,value:()=>`UTILITY ASSET`},
    {id:'wind',name:'WIND FARM',type:'RENEWABLE GENERATION',pos:[-39,21,-18],kind:'energy',priority:1,value:()=>`OUTPUT · ${Math.round(Number(window.POLAR_EMS_LIVE_STATE?.power?.windKw)||0)} kW · 5 TURBINES`},
    {id:'solar',name:'SOLAR ARRAY',type:'PV GENERATION',pos:[-18,5,-11],kind:'energy',priority:2,value:()=>`OUTPUT · ${Math.round(Number(window.POLAR_EMS_LIVE_STATE?.power?.solarKw)||0)} kW`},
    {id:'diesel',name:'DIESEL GENERATORS',type:'BACKUP GENERATION',pos:[0,10.2,28.5],kind:'energy',priority:1,value:()=>`OUTPUT · ${Math.round(Number(window.POLAR_EMS_LIVE_STATE?.power?.dieselKw)||0)} kW`},
    {id:'battery',name:'BATTERY ENERGY STORAGE',type:'BESS',pos:[26,5,-12],kind:'energy',priority:1,value:()=>`SOC · ${Math.round(Number(window.POLAR_EMS_LIVE_STATE?.battery?.socPercent)||0)}%`},
    {id:'fuel',name:'FUEL FARM',type:'DIESEL STORAGE',pos:[38,7.8,14],kind:'fuel',priority:1,value:()=>`LEVEL · ${Math.round(Number(window.POLAR_EMS_LIVE_STATE?.fuel?.liters)||0).toLocaleString()} L`},
    {id:'substation',name:'ELECTRICAL SUBSTATION',type:'SWITCHGEAR / TRANSFORMER',pos:[-8,8.5,11],kind:'energy',priority:2,value:()=>`POWER ROUTING`},
    {id:'fuelpump',name:'FUEL PUMP HOUSE',type:'TRANSFER SYSTEM',pos:[23,5.5,25],kind:'fuel',priority:4,value:()=>`FUEL TRANSFER`},
    {id:'comms',name:'COMMUNICATIONS MAST',type:'SATCOM / RADIO',pos:[17,17,0],kind:'load',priority:5,value:()=>`COMMS INFRASTRUCTURE`},
    {id:'radome',name:'WEATHER / RADOME',type:'OBSERVATION',pos:[8,6,-24],kind:'load',priority:5,value:()=>`ENVIRONMENT SENSOR`}
  ];

  // Individual turbines are intentionally not shown simultaneously. The WIND FARM
  // label identifies the complete asset group; this prevents five labels from stacking.
  const els=new Map();
  labels.forEach(a=>{
    const el=document.createElement('div');
    el.className='asset-label '+(a.kind||'');
    el.innerHTML=`<span class="asset-type">${a.type}</span><span class="asset-name">${a.name}</span><span class="asset-value">${a.value()}</span>`;
    host.appendChild(el); els.set(a.id,el);
  });

  const v=new THREE.Vector3();
  const boxes=[];
  const GAP=8;
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

  function update(){
    const w=innerWidth,h=innerHeight;
    boxes.length=0;
    const projected=[];
    labels.forEach(a=>{
      const el=els.get(a.id);
      v.set(a.pos[0],a.pos[1],a.pos[2]).project(cam);
      const behind=v.z>1 || v.z< -1;
      const x=(v.x*.5+.5)*w, y=(-v.y*.5+.5)*h;
      projected.push({a,el,x,y,behind});
    });

    // Highest-priority labels get their natural anchor first. Lower-priority labels
    // are nudged vertically until they no longer overlap an already placed label.
    projected.sort((a,b)=>(a.a.priority||9)-(b.a.priority||9));
    projected.forEach(item=>{
      const {a,el}=item;
      if(item.behind){ el.style.display='none'; return; }
      el.style.display='block';
      const value=el.querySelector('.asset-value');
      if(value) value.textContent=a.value();
      const ew=el.offsetWidth||150, eh=el.offsetHeight||40;
      let x=clamp(item.x,ew/2+8,w-ew/2-8);
      let y=clamp(item.y,eh+8,h-8);
      let tries=0;
      while(tries<16){
        const hit=boxes.some(b=>Math.abs(x-b.x)<(ew+b.w)/2+GAP && Math.abs(y-b.y)<(eh+b.h)/2+GAP);
        if(!hit) break;
        y-=eh+GAP;
        if(y<eh+8){ y=clamp(item.y+eh+GAP,eh+8,h-8); x+=Math.min(90,ew*.35); x=clamp(x,ew/2+8,w-ew/2-8); }
        tries++;
      }
      boxes.push({x,y,w:ew,h:eh});
      el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;
    });
    requestAnimationFrame(update);
  }
  update();
})();

/* DIGITAL_TWIN_MAXIMIZE_BRIDGE_V1 */
(function(){
  function setTwinMode(maximized){
    document.documentElement.classList.toggle('dt-maximized', !!maximized);
    document.body.classList.toggle('dt-maximized', !!maximized);
    // Give Three.js a frame to resize after the container changes.
    setTimeout(function(){
      try {
        if (typeof onResize === 'function') onResize();
        else window.dispatchEvent(new Event('resize'));
      } catch(e) { window.dispatchEvent(new Event('resize')); }
    }, 80);
  }
  window.addEventListener('message', function(ev){
    if(!ev || !ev.data) return;
    if(ev.data.type === 'POLAR_DIGITAL_TWIN_MAXIMIZE'){
      setTwinMode(!!ev.data.maximized);
    }
  });
})();
